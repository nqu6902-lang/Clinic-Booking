name: clinic-booking-2
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Chay python scripts/configure.py truoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:${DB_PASSWORD}@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 15
    restart: unless-stopped
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  reminders:
    build: ./backend
    command: ["python","-m","app.reminders","--loop"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:${DB_PASSWORD}@db:5432/clinic
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
