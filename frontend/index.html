
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Clinic System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <main class="card">

    <h1>Đăng nhập</h1>

    <p>Hệ thống quản lý và đặt lịch khám trực tuyến</p>

    <p id="error" class="error" hidden></p>

    <label for="username">Tên đăng nhập</label>
    <input
      id="username"
      autocomplete="username"
      placeholder="Nhập tên đăng nhập"
    >

    <label for="password">Mật khẩu</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Nhập mật khẩu"
    >

    <button id="btn">Đăng nhập →</button>

  </main>

  <aside id="demo" class="hint" hidden>
    <p class="hint-title">🔐 Tài khoản dùng thử</p>

    <table>
      <tr>
        <td>Bệnh nhân</td>
        <td><code>benhnhan</code></td>
        <td><code>benhnhan</code></td>
      </tr>
      <tr>
        <td>Lễ tân</td>
        <td><code>letan</code></td>
        <td><code>letan</code></td>
      </tr>
      <tr>
        <td>Bác sĩ</td>
        <td><code>bacsi</code></td>
        <td><code>bacsi</code></td>
      </tr>
      <tr>
        <td>Quản trị</td>
        <td><code>quantri</code></td>
        <td><code>quantri</code></td>
      </tr>
    </table>

    <p class="hint-note">
      Tên đăng nhập và mật khẩu giống nhau.
    </p>
  </aside>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
