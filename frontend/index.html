<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Clinic Booking</title>
</head>
<body>
  <h1>Clinic Booking - trang chờ</h1>
  <p>Trạng thái API: <span id="api">đang kiểm tra...</span></p>
  <p>Trạng thái CSDL: <span id="db">đang kiểm tra...</span></p>
  <script>
    fetch("/api/health").then(r => r.json())
      .then(d => document.getElementById("api").textContent = d.status)
      .catch(() => document.getElementById("api").textContent = "lỗi");
    fetch("/api/health/db").then(r => r.json())
      .then(d => document.getElementById("db").textContent = d.database)
      .catch(() => document.getElementById("db").textContent = "lỗi");
  </script>
</body>
</html>
